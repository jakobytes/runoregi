apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dhh26-runoregi
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: dhh26-runoregi:latest
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dhh26-visualizations
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  # DuckDB for R is compiled from source: give the build more CPU
  resources:
    requests:
      cpu: 400m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  output:
    to:
      kind: ImageStreamTag
      name: dhh26-visualizations:latest
